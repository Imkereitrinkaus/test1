<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiele</title>
  <style>
    :root { --bg: #f3f5f9; --card: #ffffff; --ink: #161a2b; --muted: #5d6680; --line: #c9cfdd; --accent: #1f4fd1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1220; --card: #171b2d; --ink: #e8ebf5; --muted: #9aa3bf; --line: #333a56; --accent: #8fb0ff; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    a.game {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
    }
    a.game:hover, a.game:focus-visible { border-color: var(--accent); outline: none; }
    a.game h2 { margin: 0 0 6px; font-size: 1.3rem; color: var(--accent); }
    a.game p { margin: 0; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Spiele</h1>
    <a class="game" href="blockblast.html">
      <h2>Block Blast</h2>
      <p>Teile auf ein 8×8-Feld ziehen und volle Reihen und Spalten abräumen.</p>
    </a>
    <a class="game" href="sudoku.html">
      <h2>Sudoku</h2>
      <p>Klassisches Sudoku in drei Schwierigkeitsstufen, mit Notizen und Tipps.</p>
    </a>
    <a class="game" href="burgenfehde.html">
      <h2>Burgenfehde</h2>
      <p>Baue deine Feste aus, bilde Truppen aus und überfalle fremde Burgen, um Holz und Stein zu erbeuten.</p>
    </a>
  </main>
</body>
</html>
